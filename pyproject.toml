[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subs-analytics"
version = "0.1.0"
description = "Subscription analytics (MRR, churn, cohorts, NRR) with dbt, Dagster and a semantic layer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hai Nguyen" }]
dependencies = [
  "dagster==1.13.26",
  "dagster-dbt==0.29.26",
  "dbt-core==1.11.15",
  "dbt-duckdb==1.10.1",
  "duckdb>=1.2,<2",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Cross-checks the semantic layer with dbt's own engine (tests/test_semantic.py).
metricflow = ["dbt-metricflow==0.15.0"]
ui = ["dagster-webserver==1.13.26"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "dagster-webserver==1.13.26",
]

[project.scripts]
subs = "subs_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.dagster]
module_name = "subs_analytics.definitions"
code_location_name = "subscription_analytics"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=subs_analytics --cov-report=term-missing:skip-covered"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/target", "dbt/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["subs_analytics"]

[tool.mypy]
# 3.12, not 3.11: numpy >= 2.3 stubs (imported by duckdb and matplotlib) use 3.12 syntax.
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
